[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ty.environment]
extra-paths = ["tests/ui"]

# ---------------------------------------------------------------------------
# Ruff: lint + format.  The full rule set applies to the application package
# (src/website); tests, scripts and the seed CLI keep a lighter baseline.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".specify", "specs"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "C4",           # comprehensions
    "N",            # pep8 naming
    "ANN",          # type annotations on every signature
    "D",            # docstrings (google convention)
    "RUF",          # ruff-specific
    "PL",           # pylint (complexity / size limits)
    "C90",          # mccabe complexity
    "FAST",         # FastAPI idioms (Annotated dependencies)
    "PERF",         # performance anti-patterns
    "S",            # bandit security rules
    "T20",          # no print()
    "TID",          # tidy imports (no relative imports)
    "PTH",          # pathlib over os.path
    "RET",          # return statements
    "ARG",          # unused arguments
    "BLE",          # no blind `except Exception`
    "ERA",          # no commented-out code
]
ignore = [
    "D105",  # magic methods
    "D107",  # __init__ (documented on the class)
]

[tool.ruff.lint.per-file-ignores]
"src/website/**/__init__.py" = ["D104"]
"src/website/repository/*.py" = ["S608"]  # SQL built only from constant fragments
"tests/**" = [
    "ANN", "D", "S", "PL", "N", "ARG", "PTH", "ERA", "BLE", "T20", "C90",
    "RET", "SIM", "PERF", "RUF", "FAST", "B017", "E501", "TID252",
]
"scripts/**" = [
    "ANN", "D", "S", "PL", "N", "ARG", "PTH", "ERA", "BLE", "T20", "C90",
    "RET", "SIM", "PERF", "RUF", "FAST", "E501", "B",
]
"src/cli/**" = [
    "ANN", "D", "S", "PL", "N", "ARG", "PTH", "ERA", "BLE", "T20", "C90",
    "RET", "SIM", "PERF", "RUF", "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy: strict typing for the application package, with the pydantic plugin.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src/website"]
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["pyresults", "pyresults.*", "fastapi_permissions", "slowapi", "slowapi.*", "fpdf", "fpdf.*", "weasyprint", "nh3"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# import-linter: enforce the layered architecture (see src/website/README.md).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "website"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: web -> services -> repository -> models"
type = "layers"
layers = [
    "website.main",
    "website.web",
    "website.services",
    "website.integrations | website.repository",
    "website.models",
]

[[tool.importlinter.contracts]]
name = "Business layers are framework-independent"
type = "forbidden"
source_modules = [
    "website.models",
    "website.repository",
    "website.services",
    "website.integrations",
    "website.db",
    "website.errors",
    "website.content",
    "website.richtext",
]
forbidden_modules = ["fastapi", "starlette", "jinja2", "slowapi", "fastapi_permissions"]

[[tool.importlinter.contracts]]
name = "Only services use external integrations"
type = "forbidden"
source_modules = ["website.repository", "website.models"]
forbidden_modules = ["website.integrations", "httpx", "stripe"]

[project]
name = "website"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # pyresults: standings calculation library.
    # For local development: pip install -e ../pyresults
    "pyresults @ https://github.com/matthieumarshall/pyresults/releases/download/v0.1.1/pyresults-0.1.0-py3-none-any.whl",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart>=0.0.27",
    "urllib3>=2.7.0",
    "anyio>=4.14.2",
    "bcrypt",
    "itsdangerous",
    "duckdb>=1.5.1",
    "nh3>=0.3.4",
    "slowapi>=0.1.9",
    "fastapi-permissions>=0.2.7",
    "httpx>=0.28.1",
    "fpdf2>=2.8.7",
    "cryptography>=50.0.0",
    "stripe>=15.2.0",
    "weasyprint>=70.0",
    "tenacity>=9.1.4",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.9",
    "pydantic>=2.13",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24",
    "playwright>=1.58.0",
    "pytest-playwright>=0.4.0",
]

dev = [
    "pre-commit",
    "ruff",
    "ty",
    "pip-audit>=2.6",
    "pip-licenses>=4.3",
    "bandit>=1.7",
    "djlint>=1.36.4",
    "pdfplumber>=0.11.9",
    "markdown>=3.5",
    "mypy>=1.18",
    "import-linter>=2.5",
    "diff-cover>=9.7",
]

ci = [
    "semgrep",
]

[dependency-groups]
dev = [
    "xlrd>=2.0.2",
]
