[pytest]
testpaths = tests/unit tests/ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage is collected explicitly for unit tests (see Justfile / CI) so that
# partial runs and the UI suite are not failed by the coverage threshold.
addopts = -m "not integration"
asyncio_mode = auto
markers =
    integration: marks tests as integration tests that depend on external services (deselect with '-m "not integration"')
    ui: marks browser-driven UI tests
