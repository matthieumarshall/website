[pytest]
testpaths = tests/unit tests/ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=src/website --cov-report=html --cov-report=json --cov-report=term-missing --cov-config=.coveragerc -m "not integration"
asyncio_mode = auto
markers =
    integration: marks tests as integration tests that depend on external services (deselect with '-m "not integration"')
