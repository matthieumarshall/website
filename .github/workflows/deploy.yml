name: Deploy to Production

# Runs at midnight UTC every day.
# Early-exits if the VPS is already on the latest commit of main, so no-change
# nights are a no-op.  Also supports manual triggering from the Actions tab.
#
# Prerequisites (one-time VPS setup) — see docs/setup.md:
#   1. Generate a deploy keypair:
#        ssh-keygen -t ed25519 -C "github-deploy" -f deploy_key
#      Add deploy_key.pub to /home/manager/.ssh/authorized_keys on the VPS.
#
#   2. Scope passwordless sudo to stop/start only:
#        echo 'manager ALL=(ALL) NOPASSWD: /bin/systemctl stop oxcross, /bin/systemctl start oxcross' \
#          | sudo tee /etc/sudoers.d/oxcross-deploy && sudo chmod 0440 /etc/sudoers.d/oxcross-deploy
#
#   3. Capture the VPS host fingerprint (prevents MITM):
#        ssh-keyscan -H <VPS_HOST>
#      Paste the output into the VPS_KNOWN_HOSTS secret.
#
# Required GitHub repository secrets:
#   VPS_HOST         — IP address or hostname of the Fasthosts VPS
#   VPS_USER         — SSH user (manager)
#   VPS_SSH_KEY      — Contents of the deploy_key private key file
#   VPS_KNOWN_HOSTS  — Output of: ssh-keyscan -H <VPS_HOST>
#

on:
  schedule:
    # Midnight UTC every day.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

jobs:
  deploy:
    name: Deploy to Fasthosts VPS
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      actions: read  # to confirm CI passed for the commit being deployed
      contents: read

    steps:
      - name: Set up SSH key and known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ------------------------------------------------------------------
      # Check whether the VPS is already on the latest commit of main.
      # If nothing has changed since the last deploy, skip the rest and
      # write a clear message to the step summary.
      # ------------------------------------------------------------------
      - name: Check for new commits to deploy
        id: check
        run: |
          REMOTE_HEAD=$(ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ~/website && git fetch --quiet origin main && git rev-parse HEAD")

          ORIGIN_HEAD=$(ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ~/website && git rev-parse origin/main")

          echo "deployed=$REMOTE_HEAD"
          echo "latest=$ORIGIN_HEAD"

          if [ "$REMOTE_HEAD" = "$ORIGIN_HEAD" ]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "deployed=$REMOTE_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "deployed=$REMOTE_HEAD" >> "$GITHUB_OUTPUT"
            echo "latest=$ORIGIN_HEAD"   >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — nothing to deploy
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "VPS is already on the latest commit of main (${{ steps.check.outputs.deployed }}). Nothing to deploy." | tee -a "$GITHUB_STEP_SUMMARY"

      # Only deploy a commit whose CI/CD pipeline run succeeded.
      - name: Require a green CI run for the commit
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.check.outputs.latest }}
        run: |
          passed=$(gh run list --repo "${{ github.repository }}" \
            --workflow ci-cd.yml --commit "$SHA" --status success \
            --json databaseId --jq 'length')
          if [ "$passed" -eq 0 ]; then
            echo "CI has not passed for $SHA; refusing to deploy." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Install uv on the VPS if it is not already present.
      # This is a no-op on subsequent deploys (uv self-updates are skipped).
      - name: Ensure uv is installed on VPS
        if: steps.check.outputs.skip == 'false'
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'if ! command -v uv &>/dev/null; then
               curl -LsSf https://astral.sh/uv/install.sh | sh
             fi'

      # ------------------------------------------------------------------
      # Deploy: pull → verify Chromium → stop service → sync deps → migrate
      # → start → check.
      # The service is stopped before migrations because DuckDB holds an
      # exclusive file lock on the database while uvicorn is connected.
      # Any failure after stopping the service restores the previous
      # application commit and dependencies. Migrations remain applied, so
      # they must be backward-compatible with the previous application.
      # ------------------------------------------------------------------
      - name: Deploy
        id: deploy
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -Eeuo pipefail
             export PATH="$HOME/.local/bin:$PATH"
             cd ~/website
             previous_commit="${{ steps.check.outputs.deployed }}"
             target_commit="${{ steps.check.outputs.latest }}"

             echo "--- Updating to the CI-verified commit ---"
             git fetch origin main
             git merge --ff-only "$target_commit"

             echo "--- Ensuring Python 3.14 is installed ---"
             uv python install 3.14

             echo "--- Checking Chromium system dependencies before downtime ---"
             if ! ./.venv/bin/python -m playwright install chromium; then
               echo "CHROMIUM_PREFLIGHT_FAILED"
               echo "Could not install Chromium; production service was not stopped."
               exit 1
             fi
             if ! ./.venv/bin/python -c "
               from playwright.sync_api import sync_playwright
               p = sync_playwright().start()
               browser = p.chromium.launch()
               browser.close()
               p.stop()
             "; then
               echo "CHROMIUM_PREFLIGHT_FAILED"
               echo "Chromium could not launch. Install its Linux system dependencies; production service was not stopped."
               exit 1
             fi

             rollback_active=false
             on_error() {
               original_status=$1
               trap - ERR
               if [ "$rollback_active" != true ]; then
                 echo "DEPLOY_FAILED_BEFORE_STOP status=$original_status"
                 exit "$original_status"
               fi

               set +e
               echo "--- Deployment failed; restoring $previous_commit ---"
               rollback_status=0
               sudo systemctl stop oxcross || rollback_status=1
               git reset --hard "$previous_commit" || rollback_status=1
               uv sync --python 3.14 --locked --no-dev || rollback_status=1
               uv run --python 3.14 playwright install chromium || rollback_status=1
               sudo systemctl start oxcross || rollback_status=1

               echo "--- Checking rolled-back service health ---"
               deadline=$((SECONDS + 60))
               rollback_healthy=false
               while (( SECONDS < deadline )); do
                 if curl --silent --fail --max-time 5 \
                   http://localhost:8000/ --output /dev/null; then
                   rollback_healthy=true
                   break
                 fi
                 sleep 5
               done

               if [ "$rollback_healthy" = true ] && [ "$rollback_status" -eq 0 ]; then
                 echo "ROLLBACK_RESULT=success"
                 echo "Rolled-back application is healthy; database migrations were retained."
               else
                 echo "ROLLBACK_RESULT=failure"
                 echo "Rollback did not fully recover production; manual intervention is required."
               fi
               exit "$original_status"
             }
             trap 'on_error $?' ERR

             echo "--- Stopping service before replacing its environment ---"
             rollback_active=true
             sudo systemctl stop oxcross

             echo "--- Syncing production dependencies ---"
             uv sync --python 3.14 --locked --no-dev

             echo "--- Installing Chromium for results scraping ---"
             uv run --python 3.14 playwright install chromium
             uv run --python 3.14 python -c "
               from playwright.sync_api import sync_playwright
               p = sync_playwright().start()
               browser = p.chromium.launch()
               browser.close()
               p.stop()
             "

             echo "--- Running migrations ---"
             uv run --python 3.14 python scripts/_apply_migrations.py

             echo "--- Starting service ---"
             sudo systemctl start oxcross

             echo "--- Public health check (up to 120 seconds) ---"
             deadline=$((SECONDS + 120))
             healthy=false
             while (( SECONDS < deadline )); do
               response_code=$(curl --silent --output /dev/null \
                 --write-out "%{http_code}" --max-time 5 \
                 https://oxfordshirexcleague.uk/ || true)
               if [[ "$response_code" =~ ^[23][0-9][0-9]$ ]]; then
                 healthy=true
                 break
               fi
               sleep 5
             done

             if [ "$healthy" = true ]; then
               echo "Public health check passed (HTTP $response_code)."
             else
               echo "Public health check failed (last HTTP status: ${response_code:-none})."
               on_error 1
             fi
            ' 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          deploy_status=${PIPESTATUS[0]}
          if [ "$deploy_status" -eq 0 ]; then
            echo "result=deployed" >> "$GITHUB_OUTPUT"
          elif grep -Fq "ROLLBACK_RESULT=success" "$RUNNER_TEMP/deploy.log"; then
            echo "result=rollback_succeeded" >> "$GITHUB_OUTPUT"
            exit "$deploy_status"
          elif grep -Fq "ROLLBACK_RESULT=failure" "$RUNNER_TEMP/deploy.log"; then
            echo "result=rollback_failed" >> "$GITHUB_OUTPUT"
            exit "$deploy_status"
          elif grep -Fq "CHROMIUM_PREFLIGHT_FAILED" "$RUNNER_TEMP/deploy.log"; then
            echo "result=chromium_preflight_failed" >> "$GITHUB_OUTPUT"
            exit "$deploy_status"
          elif grep -Fq "DEPLOY_FAILED_BEFORE_STOP" "$RUNNER_TEMP/deploy.log"; then
            echo "result=failed_before_stop" >> "$GITHUB_OUTPUT"
            exit "$deploy_status"
          else
            echo "result=failed_before_recovery_handler" >> "$GITHUB_OUTPUT"
            exit "$deploy_status"
          fi

      - name: Write deployment summary
        if: always() && steps.check.outputs.skip == 'false'
        run: |
          case "${{ steps.deploy.outputs.result }}" in
            deployed)
              cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Deployment Complete

          | | |
          |---|---|
          | **Previous commit** | \`${{ steps.check.outputs.deployed }}\` |
          | **Deployed commit** | \`${{ steps.check.outputs.latest }}\` |
          | **Triggered by** | ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reason || 'Scheduled midnight run' }} |
          EOF
              ;;
            rollback_succeeded)
              echo "## Deployment failed; rollback succeeded" >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' \
                "The application was restored to \`${{ steps.check.outputs.deployed }}\` and passed the local health check." \
                "Database migrations were retained." >> "$GITHUB_STEP_SUMMARY"
              ;;
            rollback_failed)
              echo "## Deployment and rollback failed" >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' \
                "Manual intervention is required. The previous application commit was \`${{ steps.check.outputs.deployed }}\`." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
            chromium_preflight_failed)
              echo "## Deployment stopped before downtime: Chromium preflight failed" >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' \
                "The service was not stopped. Check the deploy logs and provision" \
                "Chromium's Linux system dependencies before retrying." >> "$GITHUB_STEP_SUMMARY"
              ;;
            failed_before_stop)
              echo "## Deployment failed before stopping the service" >> "$GITHUB_STEP_SUMMARY"
              echo "Production was not intentionally stopped; inspect the deploy logs." >> "$GITHUB_STEP_SUMMARY"
              ;;
            '')
              echo "## Deployment did not run" >> "$GITHUB_STEP_SUMMARY"
              echo "A prerequisite step failed or skipped deployment; inspect the workflow steps." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "## Deployment outcome unknown" >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' \
                "Inspect the deploy logs and verify production service health; the remote connection may have ended before recovery status was reported." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
