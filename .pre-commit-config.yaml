default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-r", "src/", "-ll", "--skip", "B101"]
        pass_filenames: false
        # B101 (assert usage) is acceptable in test support code;
        # -ll = medium severity and above only

  # YAML syntax and formatting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]

  # GitHub Actions workflow static analysis:
  # validates expression syntax, checks for undefined secrets, action versions, etc.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # Python tooling runs from the project's locked environment (uv.lock) so the
  # versions used locally, in pre-commit and in CI can never drift apart.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: uv run ruff check --fix
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format
        types_or: [python, pyi]

      - id: mypy
        name: mypy (strict, src/website)
        language: system
        entry: uv run mypy
        pass_filenames: false
        types: [python]

      - id: ty
        name: ty
        language: system
        entry: uv run ty check
        pass_filenames: false
        types: [python]

      - id: import-linter
        name: import-linter (layer contracts)
        language: system
        entry: uv run lint-imports
        pass_filenames: false
        types: [python]

      - id: file-length
        name: module size limit (1000 lines)
        language: system
        entry: uv run python scripts/check_file_length.py --max 1000 --warn 500
        types: [python]
        files: ^src/

      - id: djlint
        name: djlint
        language: python
        additional_dependencies: ["djlint>=1.36.4"]
        entry: djlint --lint
        files: ^templates/.*\.html$

      - id: unit-tests
        name: unit tests (pre-push)
        language: system
        entry: uv run pytest tests/unit -x -q
        pass_filenames: false
        stages: [pre-push]
