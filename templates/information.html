{% extends "base.html" %}
{% block title %}{{ title }} — Oxfordshire Cross Country League{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">{{ title }}</h1>
      {% if is_admin %}<a href="/{{ slug }}/edit" class="btn btn-outline-secondary btn-sm">Edit</a>{% endif %}
    </div>
    {{ content | safe }}
  </div>
</div>
{% endblock %}
