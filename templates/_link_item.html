{% if is_staff %}
<div id="link-item-{{ link.id }}" class="list-group-item d-flex flex-wrap align-items-center justify-content-between gap-2">
  <div class="me-auto">
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer" class="fw-semibold text-decoration-none">
        {{ link.title }}
      </a>
      {% if not link.is_active %}
      <span class="badge text-bg-secondary">Hidden</span>
      {% endif %}
      <span class="badge text-bg-light border text-muted small">Order: {{ link.sort_order }}</span>
    </div>
    {% if link.description %}
    <span class="d-block small text-muted">{{ link.description }}</span>
    {% endif %}
    <span class="d-block small text-muted font-monospace">{{ link.url }}</span>
  </div>
  <div class="d-flex gap-1">
    <button type="button" class="btn btn-outline-secondary btn-sm"
            hx-get="/links/{{ link.id }}/inline-form"
            hx-target="#link-item-{{ link.id }}"
            hx-swap="outerHTML">
      Edit
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm"
            hx-post="/links/{{ link.id }}/inline-toggle"
            hx-vals='{"csrf_token": "{{ csrf_token }}"}'
            hx-target="#link-item-{{ link.id }}"
            hx-swap="outerHTML">
      {{ 'Hide' if link.is_active else 'Show' }}
    </button>
    <button type="button" class="btn btn-outline-danger btn-sm"
            hx-post="/links/{{ link.id }}/inline-delete"
            hx-vals='{"csrf_token": "{{ csrf_token }}"}'
            hx-confirm="Are you sure you want to delete this link?"
            hx-target="#link-item-{{ link.id }}"
            hx-swap="outerHTML">
      Delete
    </button>
  </div>
</div>
{% else %}
<a id="link-item-{{ link.id }}" class="list-group-item list-group-item-action" href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
  <span class="fw-semibold">{{ link.title }}</span>
  {% if link.description %}<span class="d-block small text-muted">{{ link.description }}</span>{% endif %}
</a>
{% endif %}
