<tr id="club-row-{{ club.id }}" class="table-active">
  <td colspan="7" class="p-3">
    <div class="card shadow-sm border-primary">
      <div class="card-body">
        <h2 class="h6 mb-3">Edit {{ club.name }}</h2>
        {% if error %}<div class="alert alert-danger py-1 small mb-2" role="alert">{{ error }}</div>{% endif %}
        <form hx-post="/clubs/{{ club.id }}/inline-edit"
              hx-target="#club-row-{{ club.id }}"
              hx-swap="outerHTML">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <label for="name-{{ club.id }}" class="form-label small mb-1">Club name</label>
              <input type="text" id="name-{{ club.id }}" name="name" class="form-control form-control-sm" required value="{{ club.name }}">
            </div>
            <div class="col-6 col-md-2">
              <label for="oxl_code-{{ club.id }}" class="form-label small mb-1">OXL code</label>
              <input type="text" id="oxl_code-{{ club.id }}" name="oxl_code" class="form-control form-control-sm" required value="{{ club.oxl_code }}">
            </div>
            <div class="col-6 col-md-2">
              <label for="ea_club_id-{{ club.id }}" class="form-label small mb-1">EA club ID</label>
              <input type="text" id="ea_club_id-{{ club.id }}" name="ea_club_id" class="form-control form-control-sm" required value="{{ club.ea_club_id }}">
            </div>
            <div class="col-6 col-md-2">
              <label for="opentrack_code-{{ club.id }}" class="form-label small mb-1">OpenTrack code</label>
              <input type="text" id="opentrack_code-{{ club.id }}" name="opentrack_code" class="form-control form-control-sm" value="{{ club.opentrack_code or '' }}">
            </div>
            <div class="col-6 col-md-2">
              <label for="website_url-{{ club.id }}" class="form-label small mb-1">Website URL</label>
              <input type="url" id="website_url-{{ club.id }}" name="website_url" class="form-control form-control-sm" value="{{ club.website_url or '' }}">
            </div>
            <div class="col-12 d-flex align-items-center justify-content-between pt-2">
              <div class="d-flex gap-3">
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" id="is_oxfordshire-{{ club.id }}" name="is_oxfordshire_member" {% if club.is_oxfordshire_member %}checked{% endif %}>
                  <label class="form-check-label small" for="is_oxfordshire-{{ club.id }}">Oxfordshire member</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" id="is_active-{{ club.id }}" name="is_active" {% if club.is_active %}checked{% endif %}>
                  <label class="form-check-label small" for="is_active-{{ club.id }}">Active</label>
                </div>
              </div>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm"
                        hx-get="/clubs/{{ club.id }}/inline-row"
                        hx-target="#club-row-{{ club.id }}"
                        hx-swap="outerHTML">
                  Cancel
                </button>
                <button type="submit" class="btn btn-primary btn-sm">Save</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </td>
</tr>
