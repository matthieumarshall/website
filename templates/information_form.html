{% extends "base.html" %}
{% block title %}Edit {{ title }} — Oxfordshire Cross Country League{% endblock %}
{% block extra_head %}
<link href="/static/quill.snow.css" rel="stylesheet">
<link href="/static/quill-better-table.css" rel="stylesheet">
{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Edit {{ title }}</h1>
<form action="/{{ slug }}/edit" method="post" id="rules-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="content" id="rules-content-input">
  <div id="editor">{{ content | safe }}</div>
  <div class="d-flex gap-2 mt-3">
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="/{{ slug }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
{% block extra_scripts %}
<script src="/static/quill.min.js"></script>
<script src="/static/quill-better-table.min.js"></script>
<script src="/static/rules-editor.js"></script>
{% endblock %}
